name: Metrics
on:
  # Roda a cada 24 horas
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente
  workflow_dispatch:
  # Roda no push da main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # --- CONFIGURAÇÃO LIMPA ---
          user: joaorizzo0112
          template: classic
          config_timezone: America/Sao_Paulo
          
          # "base" define o que aparece no topo (Status/Header)
          # header = foto e nome
          # activity = commits e PRs
          # community = seguidores
          # repositories = licenças e estrelas
          base: header, activity, community, repositories
          
          # --- LINGUAGENS (Para substituir seus ícones) ---
          plugin_languages: yes
          plugin_languages_ignored: ""       # Mostra tudo (HTML/CSS/Python...)
          plugin_languages_limit: 8          # Quantidade de linguagens
          plugin_languages_threshold: 0%     # Mostra até as pequenas
          plugin_languages_colors: github    # Cores originais
          plugin_languages_details: bytes-size, percentage
          
          # Desativei o calendário e a bio para ficar só Status + Linguagens
          plugin_isocalendar: no
          plugin_introduction: no
          plugin_lines: no
