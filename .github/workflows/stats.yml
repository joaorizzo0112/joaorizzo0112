name: Update Stats

on:
  schedule:
    # Roda todo dia meia-noite
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download Images (Force)
        run: |
          # 1. Baixa o cartão de Status e salva como stats-card.svg
          curl -o stats-card.svg "https://github-readme-stats.vercel.app/api?username=joaorizzo0112&show_icons=true&theme=tokyonight&count_private=true&hide_border=true"
          
          # 2. Baixa o cartão de Linguagens e salva como top-langs.svg
          curl -o top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=joaorizzo0112&layout=compact&theme=tokyonight&hide_border=true"

      - name: Save to GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update stats images daily"
          file_pattern: "*.svg"
